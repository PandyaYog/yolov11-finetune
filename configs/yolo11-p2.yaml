# YOLO11 with an added P2/4 detection head, for this corpus's small objects.
#
# WHY
#   Stock YOLO11 detects on P3/8, P4/16, P5/32. Measured over this corpus's
#   65,410 boxes (shorter side, at 640x480):
#
#       median 44.9px   |   34.6% below 32px   |   9.2% below 16px
#
#   and the two classes that are 60% of all boxes sit right at the floor:
#   benthic_invert median 33.2px, reef 32.4px. On the P3 stride-8 grid a 32px
#   object spans 4 cells and a 16px object spans 2 -- workable, but with no
#   margin, and mosaic augmentation halves those figures again.
#
#   P2 detects at stride 4, doubling the grid resolution for exactly that
#   population: a 16px object gets 4 cells instead of 2, a 32px one gets 8.
#   This is a more targeted fix than moving n -> s, which adds capacity
#   everywhere rather than resolution where the objects actually are.
#
# COST
#   The P2 feature map is 160x120 at this input size -- 4x the cells of P3 --
#   so expect roughly +40-60% training step time and a similar inference hit
#   versus plain yolo11n. That matters for the Jetson target (see README);
#   benchmark before committing to it for deployment, same caveat as yolo11s.
#
# USE
#   python scripts/05_train.py --model configs/yolo11-p2.yaml --name yolo11n_p2
#
#   Note this is a MODEL DEFINITION, not pretrained weights: training from it
#   starts from random init, losing the COCO pretraining that `yolo11n.pt`
#   brings. To keep the pretrained backbone, pass the .pt as well -- Ultralytics
#   will load what matches by shape and randomly init the new P2 layers:
#       model = YOLO("configs/yolo11-p2.yaml").load("yolo11n.pt")
#   scripts/05_train.py does this automatically when --model ends in .yaml and
#   --pretrained points at a checkpoint.

# Parameters
nc: 8 # fish, benthic_invert, gelatinous, flora, debris, person, equipment, reef
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  # --- extra top-down step to P2/4 (this is the addition) ------------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2 (layer 2)
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)

  # --- bottom-up path, now starting from P2 --------------------------------
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
