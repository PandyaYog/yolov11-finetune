# Unified taxonomy for the amphibious survey robot.
#
# Design rule: collapse species -> function. The model is an AUTO-LABELER, not a
# controller. Reliably saying "fish" is worth more than unreliably saying
# "rockfish", because a wrong label writes corrupted data into the archive while
# a missed label only falls to the unknown bucket for human review.
# v2 (2026-09-03): 11 classes -> 8. Dropped vessel + buoy_marker (surface-only,
# and the surface sources are disabled in configs/datasets.yaml) and rope_net
# (119 boxes / 104 images corpus-wide -- not enough to train, and the
# group-aware split left it with zero test instances, so it had no honest
# held-out read either). CLASS IDS ARE RENUMBERED, so v1 checkpoints
# (runs/train/yolo11n_enhanced*) are NOT label-compatible with a v2 corpus --
# don't evaluate an old checkpoint against a newly-built dataset or every class
# will silently shift by one or more indices.
#
# rope_net was a real requirement, not filler: a rope or net is an entanglement
# hazard for a thrustered robot, which is a different failure mode from "loose
# trash in frame" (debris). It is retired for lack of data, NOT because the
# hazard stopped mattering -- restoring it needs dedicated collection, not a
# hyperparameter change.
version: 2

names:
  0: fish
  1: benthic_invert
  2: gelatinous
  3: flora
  4: debris
  5: person
  6: equipment
  # v2.1: was `structure`, which conflated two populations that share nothing.
  # FathomNet supplied 86% of it as sponges/corals/sea pens -- living, sessile,
  # median box 0.4% of frame -- while SUIM's WR supplied shipwrecks at a median
  # of 51.7%. A 130x scale gap and no visual overlap under one label; no amount
  # of data teaches a coherent concept across that. `reef` keeps the living
  # sessile organisms (~8.8k boxes after the FathomNet recovery, a healthy
  # class). The 349 man-made wreck boxes are retired for the same reason
  # rope_net was: too thin to train, and keeping them would poison the class
  # they were sharing. Worth collecting properly later -- a wreck is a
  # legitimate survey find.
  7: reef

# Classes active per operating mode. Used at inference to mask logits based on
# the depth sensor -- free elimination of most cross-domain false positives.
# Not used during training (one model, full label space).
#
# `surface` is inherited from v1 and is currently NOT backed by training data:
# every surface source is disabled, so a v2 model has seen no in-air imagery.
# Kept so the amphibious wiring stays in place, but do not read it as a claim
# that surface detection works in this round.
modes:
  submerged: [fish, benthic_invert, gelatinous, flora, debris, person, equipment, reef]
  surface:   [debris, person]

# ---------------------------------------------------------------------------
# Per-dataset source-label -> unified class.
# ANY source label not listed here is DROPPED. Drops are counted and reported
# by unify_datasets.py so you can audit what you threw away.
# ---------------------------------------------------------------------------
maps:

  duo:
    # All four DUO classes are harvest targets. For our mission they are one
    # thing: "small benthic organism". This is why DUO is capped hard -- it
    # carries ~74k boxes of a single unified class.
    holothurian: benthic_invert
    echinus: benthic_invert
    scallop: benthic_invert
    starfish: benthic_invert

  brackish:
    fish: fish
    small_fish: fish
    "small fish": fish
    "big fish": fish
    crab: benthic_invert
    shrimp: benthic_invert
    starfish: benthic_invert
    jellyfish: gelatinous

  trashcan:
    rov: equipment
    plant: flora
    animal_fish: fish
    animal_eel: fish
    animal_starfish: benthic_invert
    animal_shells: benthic_invert
    animal_crab: benthic_invert
    # animal_etc: DROPPED -- too ambiguous to label confidently
    # trash_rope, trash_net: DROPPED in v2 with the rope_net class. Left
    # unmapped rather than pointed at a dead class name on purpose:
    # Taxonomy.map_label() resolves a map target through id_of.get(), so a
    # target that no longer exists in `names` returns None and the box is
    # dropped WITHOUT being counted in the drop report. Unmapped labels take
    # the counted path instead, so these stay visible in the unify summary.
    trash_bag: debris
    trash_bottle: debris
    trash_can: debris
    trash_container: debris
    trash_cup: debris
    trash_clothing: debris
    trash_pipe: debris
    trash_snack_wrapper: debris
    trash_tarp: debris
    trash_unknown_instance: debris
    # v2.1: trash_branch was `flora`. It is sunken dead wood -- 336 of the 843
    # raw boxes that fed flora -- so it was training "living seagrass/kelp" on
    # waterlogged branches. debris is the honest home for it.
    trash_branch: debris
    # trash_wreckage: DROPPED in v2.1 with the man-made half of `structure`.
    # Unmapped rather than pointed at a dead class name, so the boxes show up
    # in the unify drop report instead of vanishing through id_of.get() -> None.

  suim:
    # SUIM ships RGB-coded masks; these are the 3-bit colour codes.
    HD: person          # human divers
    PF: flora           # plants / sea-grass
    RO: equipment       # robots / instruments
    RI: benthic_invert  # reefs / invertebrates
    FV: fish            # fish and vertebrates
    # WR (wrecks / ruins): DROPPED in v2.1 with the man-made half of
    # `structure` -- 268 boxes at a median 51.7% of frame, against a `reef`
    # median of 0.4%. Unmapped rather than pointed at a dead class name, so
    # the drop is counted in the unify report.
    # SR (sand/sea-floor/rocks) and BW (background/water) DROPPED on purpose:
    # they are full-frame regions and would produce one giant useless box per
    # image. See reader config `max_area_frac`.

  vddc:
    diver: person
    person: person

  fathomnet:
    # Populated from configs/datasets.yaml `fathomnet.concepts`, which maps
    # concept -> unified class directly at download time. Kept here for the
    # non-biological concepts that come back with literal names.
    trash: debris
    equipment: equipment
    # rope: DROPPED in v2 with the rope_net class -- see the trashcan note above
    # for why it is unmapped rather than pointed at the retired class name.

  # ----------------------------------------------------------------- retired --
  # v2 removed the surface domain (configs/datasets.yaml has seaships / smd /
  # mods / mastr_neg disabled) and with it the vessel and buoy_marker classes.
  # These map blocks are kept, not deleted: they are never consulted while
  # their datasets are disabled, and they carry findings that cost real
  # debugging to establish (see the seaships note). If you re-enable any of
  # these sources, restore `vessel` / `buoy_marker` to `names` FIRST -- a map
  # target missing from `names` drops its boxes silently, without appearing in
  # the unify drop report.

  seaships:
    # The paper's 6 classes are ore carrier/bulk cargo carrier/general cargo
    # ship/container ship/fishing boat/passenger ship, but the mirror this
    # repo downloads (see configs/datasets.yaml -> seaships) ships a
    # different, coarser label set under the same dataset name. Only
    # "Passenger Ship" happened to case-insensitively match the paper names
    # below, so the other 5 classes -- ~28.7k of ~33.3k boxes -- were
    # silently dropped. Verified against the actual XMLs
    # (data/raw/seaships/annotations/*.xml); every one of these is some kind
    # of ship, so all six collapse to "vessel" same as before.
    "Bulk Carrier": vessel
    "Cargo Ship": vessel
    "Passenger Ship": vessel
    "Other Ship": vessel
    "Fishing Vessel": vessel
    "Pleasure Craft": vessel
    # Kept in case a future re-download reverts to the paper's original mirror.
    ore carrier: vessel
    bulk cargo carrier: vessel
    general cargo ship: vessel
    container ship: vessel
    fishing boat: vessel
    passenger ship: vessel

  smd:
    Ferry: vessel
    Boat: vessel
    Vessel/ship: vessel
    "Speed boat": vessel
    Kayak: vessel
    "Sail boat": vessel
    Buoy: buoy_marker
    "Swimming person": person
    # Flying bird/plane, Other: DROPPED

  mods:
    ship: vessel
    boat: vessel
    person: person
    buoy: buoy_marker

  flow:
    bottle: debris
    debris: debris
    trash: debris

  trash_icra19:
    plastic: debris
    trash_plastic: debris
    rov: equipment
    # bio: DROPPED -- unlabelled mixture of flora and fauna
