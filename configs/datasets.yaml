# Dataset registry: where each source comes from, how to read it, how much to keep.
#
# METHODS
#   http      direct URL(s), auto-downloaded and extracted
#   kaggle    kaggle datasets download -d <slug>   (needs ~/.kaggle/kaggle.json)
#   gdown     Google Drive file id
#   roboflow  Roboflow API (needs ROBOFLOW_API_KEY)
#   fathomnet FathomNet REST API via fathomnet-py
#   manual    you download it yourself; the script prints instructions and then
#             verifies + extracts whatever you dropped in data/raw/_archives/
#
# Most marine datasets live behind Google Drive links or institutional
# repositories with click-through licences. "manual" is the honest default for
# those -- the downloader will not invent URLs it cannot verify.

root: data/raw
archives: data/raw/_archives

# Global image geometry. Mirrors the OAK-D-Lite pipeline exactly:
#   12MP 4:3 capture -> ISP downscale 640x480 -> WaterNet -> letterbox 640 -> YOLO
# 640x480 is pixel-identical to the OAK-D-Lite depth map, so a detection box
# maps onto depth with zero resampling.
geometry:
  width: 640
  height: 480
  fit: crop             # crop | pad  (crop preserves scale, pad preserves content)
  min_box_visible: 0.3  # drop a box if cropping leaves <30% of it
  jpeg_quality: 95

split:
  train: 0.80
  val: 0.10
  test: 0.10
  seed: 1337
  # Splits are assigned by GROUP (video / dive / site), never per-image.
  # Random per-image splitting on video-derived data leaks near-duplicate
  # adjacent frames across train and val and inflates mAP by tens of points.

datasets:
  # `domain: submerged | surface` -- which WaterNet branch this source belongs
  # to. WaterNet corrects underwater light attenuation/backscatter; running it
  # on an already-correct in-air surface photo distorts a non-problem instead
  # of fixing one. scripts/04_enhance_waternet.py only runs WaterNet on
  # `submerged` images and copies `surface` images through untouched, so
  # training sees exactly what the robot will produce at inference: WaterNet
  # output when submerged, raw ISP output on the surface.

  # ---------------------------------------------------------------- benthic --
  duo:
    enabled: true
    domain: submerged
    title: "DUO - Detecting Underwater Objects"
    cite: "arXiv:2106.05681"
    licence: "Research use; see repo"
    sources:
      - method: manual
        expect: "DUO.zip"
        note: |
          1. Open https://github.com/chongweiliu/DUO
          2. Follow the Google Drive link in the README.
          3. Save the archive as data/raw/_archives/DUO.zip
          Expected tree after extraction:
            DUO/annotations/instances_train.json
            DUO/annotations/instances_test.json
            DUO/images/train/*.jpg
    layout:
      reader: coco
      parts:
        - ann: "annotations/instances_train.json"
          images: "images/train"
        - ann: "annotations/instances_test.json"
          images: "images/test"
    group: {mode: none}
    stride: 1
    cap: 2500
    dedupe_phash: 6

  # ------------------------------------------------------------ water column --
  brackish:
    enabled: true
    domain: submerged
    title: "Brackish Dataset (AAU, Limfjorden)"
    cite: "vap.aau.dk/the-brackish-dataset"
    licence: "CC BY 4.0"
    sources:
      - method: kaggle
        slug: "aalborguniversity/brackish-dataset"
      - method: manual
        expect: "brackish-dataset.zip"
        note: |
          https://www.kaggle.com/datasets/aalborguniversity/brackish-dataset
          Save as data/raw/_archives/brackish-dataset.zip
    # The AAU release ships AAU bbox, YOLO Darknet and COCO annotations; COCO
    # is used here because the class-id ordering of the Darknet export is not
    # documented. The Kaggle mirror ships raw .avi videos, not frames -- the
    # COCO json file_names reference PNG frames at 960x540 that do not exist
    # until scripts/02_extract_brackish_frames.py has been run (it decodes
    # dataset/videos/*/*.avi into images_extracted/ with ffmpeg, matching the
    # naming the dataset's own frameExtractor.py used: "<video-stem>-%04d.png").
    # Annotation paths are literal, not globs: annotations_COCO/ also carries
    # *_helper_dirs.json files whose names collide with a "*train*.json" glob.
    layout:
      reader: coco
      parts:
        - ann: "annotations/annotations_COCO/train_groundtruth.json"
          images: "images_extracted"
        - ann: "annotations/annotations_COCO/valid_groundtruth.json"
          images: "images_extracted"
        - ann: "annotations/annotations_COCO/test_groundtruth.json"
          images: "images_extracted"
    # 14,518 frames from 89 videos at 30fps -> heavy temporal redundancy.
    # Frame stems are "<video-stem>-%04d" (e.g.
    # "2019-02-21_06-36-31to2019-02-21_06-36-39_1-0082"); the video's own
    # date/time uses "_" between date and time, not "-", so a pattern
    # expecting an all-dash timestamp never matches -- it silently fell back
    # to one-group-per-image (see "Splits" below), which defeated both the
    # group-aware split and `stride` (nothing to subsample within a group of
    # one). Match everything before the trailing frame number instead.
    group: {mode: regex, pattern: "^(.+)-\\d{4}$"}
    stride: 6
    cap: 2500
    dedupe_phash: 6

  fathomnet:
    enabled: true
    domain: submerged
    title: "FathomNet (MBARI)"
    cite: "Sci Rep 12, 15914 (2022)"
    licence: "CC BY 4.0 per-image; verify before redistribution"
    sources:
      - method: fathomnet
    # Deep-sea imagery: black water, hard ROV lighting. The domain gap vs a
    # shallow amphibious robot is real, so this is diversity ballast, not core.
    # Verify concept strings against the live API before bulk pulling:
    #   python scripts/download_datasets.py --dataset fathomnet --list-concepts
    # Concepts are chosen for MORPHOLOGICAL spread, not taxonomic coverage.
    # Every one of these collapses to a single unified class, so the model
    # learns "fish-shaped thing in water", not species. What buys generalisation
    # is silhouette variety -- fusiform, elongate, flattened, globular,
    # tapering-tail -- so the list spans body plans rather than clades.
    concepts:
      fish:
        [Actinopterygii,          # coarse superclass: the diversity workhorse
         Sebastes, Sebastolobus, Scorpaenidae,        # robust / spiny
         Merlucciidae, Ophidiidae,                    # elongate
         Macrouridae,                                 # tapering tail
         Bathylagidae, Myctophidae,                   # small, large-eyed
         "Anoplopoma fimbria", Zoarcidae,             # eel-like
         Chauliodus, Melanocetus,                     # deep-sea predator forms
         Careproctus,                                 # snailfish
         Pleuronectiformes,                           # flatfish silhouette
         Rajiformes, Chimaeriformes, Elasmobranchii]  # disc / cartilaginous
      gelatinous:
        [Scyphozoa, Hydrozoa, Ctenophora, Siphonophorae, Solmissus,
         "Nanomia bijuga", Poralia, Beroe, "Aegina citrea", Atolla,
         Salpida, Larvacea, Bolinopsis, Praya, Physonectae]
      benthic_invert:
        [Echinoidea, Asteroidea, Holothuroidea, Ophiuroidea, Crinoidea,
         Brisingida, Decapoda, Munidopsis, Paguridae, Gastropoda, Bivalvia,
         Octopoda, Actiniaria, Isopoda, Polychaeta]
      flora: ["Macrocystis pyrifera", Algae, Phaeophyceae, Chlorophyta]
      equipment: [equipment]
      debris: [trash]
      structure: [Porifera, Anthozoa, Scleractinia, Gorgonacea, Pennatulacea]
    # Per-concept ceiling. Lower than before BECAUSE the list is longer: the
    # same download budget now buys more body plans instead of more images of
    # the same few. Raising this would deepen coverage of concepts already
    # represented, which is not the axis that was short.
    per_concept_cap: 400
    # Download budget. Fetching is round-robin across concepts, so stopping
    # early still leaves balanced coverage.
    target_total: 12000
    layout:
      reader: coco
      parts:
        - ann: "fathomnet/annotations.json"
          images: "fathomnet/images"
    group: {mode: field, field: "dive"}
    stride: 1
    cap: 10000

  # ------------------------------------------------------------------ debris --
  trashcan:
    enabled: true
    domain: submerged
    title: "TrashCan 1.0 (UMN / JAMSTEC J-EDI)"
    cite: "arXiv:2007.08097"
    licence: "See UMN Digital Conservancy record"
    sources:
      - method: kaggle
        slug: "mexwell/trashcan-1-0"
      - method: manual
        expect: "trashcan.zip"
        note: |
          Fallback: https://conservancy.umn.edu/handle/11299/214865
          Use the *instance* version. Save as data/raw/_archives/trashcan.zip
    layout:
      reader: coco
      parts:
        - ann: "trashcan/instance_version/instances_train_trashcan.json"
          images: "trashcan/instance_version/train"
        - ann: "trashcan/instance_version/instances_val_trashcan.json"
          images: "trashcan/instance_version/val"
    # Sourced from ROV video; filenames carry the source dive id.
    group: {mode: regex, pattern: "^([a-zA-Z0-9]+)_"}
    stride: 1
    cap: 6000
    dedupe_phash: 5

  trash_icra19:
    enabled: true
    domain: submerged
    title: "Trash-ICRA19"
    licence: "See UMN Digital Conservancy record"
    sources:
      - method: kaggle
        slug: "atiqishrak/trash-dataset-icra19"
      - method: manual
        expect: "trash_icra19.zip"
        note: |
          https://www.kaggle.com/datasets/atiqishrak/trash-dataset-icra19
          Fallback: https://conservancy.umn.edu/handle/11299/214366
          Save as data/raw/_archives/trash_icra19.zip
    layout:
      reader: yolo
      parts:
        - ann: "**/dataset/train"
          images: "**/dataset/train"
        - ann: "**/dataset/val"
          images: "**/dataset/val"
      names: [plastic, bio, rov]
    group: {mode: regex, pattern: "^([a-zA-Z0-9]+)_"}
    stride: 3
    cap: 3000
    dedupe_phash: 5

  flow:
    enabled: false     # debris class well-covered by trashcan + trash_icra19
    domain: surface
    title: "FloW-Img (floating waste, USV)"
    licence: "Research use"
    sources:
      - method: manual
        expect: "flow_img.zip"
        note: |
          Apply at: https://world.orca-tech.cn/
          Navigate to "Customer Support -> Dataset -> FloW"
          GitHub: https://github.com/ORCA-Uboat/FloW-Dataset
          Save as data/raw/_archives/flow_img.zip
    layout:
      reader: coco
      parts:
        - ann: "flow/annotations/train.json"
          images: "flow/images/train"
    group: {mode: none}
    stride: 1
    cap: 2000

  # ------------------------------------------------------- divers / structure --
  suim:
    enabled: true
    domain: submerged
    title: "SUIM - Segmentation of Underwater IMagery"
    licence: "MIT (verify)"
    sources:
      - method: kaggle
        slug: "ashish2001/semantic-segmentation-of-underwater-imagery-suim"
      - method: manual
        expect: "SUIM.zip"
        note: |
          https://www.kaggle.com/datasets/ashish2001/semantic-segmentation-of-underwater-imagery-suim
          Fallback: https://github.com/xahidbuffon/SUIM  (Google Drive link in README)
          Save as data/raw/_archives/SUIM.zip
          Best value-per-image of the whole collection: divers, wrecks, robots,
          reefs, fish and flora all in one 1525-image set.
    # Only train_val is read here. TEST ships its masks pre-split into one
    # binary folder per class (masks/FV, masks/HD, ...) rather than combined
    # RGB-coded masks like train_val -- feeding that tree through this reader
    # would re-yield every TEST image once per class subfolder it appears in
    # (a binary presence mask misread as an RGB palette code, mostly matching
    # nothing). train_val alone is enough: unify_datasets.py's own group split
    # (mode: none, so per-image) still carves it into train/val/test.
    layout:
      reader: mask_rgb
      parts:
        - ann: "**/train_val/masks"
          images: "**/train_val/images"
      # 3-bit RGB colour codes -> source label
      palette:
        "0,0,255": HD
        "0,255,0": PF
        "0,255,255": WR
        "255,0,0": RO
        "255,0,255": RI
        "255,255,0": FV
        "255,255,255": SR
        "0,0,0": BW
      min_area_frac: 0.0015   # ignore specks
      max_area_frac: 0.60     # ignore full-frame regions (seafloor, open water)
    group: {mode: none}
    stride: 1
    cap: null

  vddc:
    enabled: true
    domain: submerged
    title: "VDD-C - Video Diver Dataset"
    licence: "See UMN Digital Conservancy record"
    sources:
      - method: manual
        expect: "images.zip"
        note: |
          https://conservancy.umn.edu/items/3b926c46-c328-40d8-841f-069ef8ab1ce2
          Download ONLY these 2 files:
            1. images.zip (7.63 GB) -- processed images
            2. yolo_labels.zip (27.82 MB) -- YOLO style labels
          Save both in data/raw/_archives/
          Role here is PRIVACY FILTER, not safety -- hence the hard cap.
      - method: manual
        expect: "yolo_labels.zip"
        note: |
          See above -- download yolo_labels.zip from the same UMN page.
    layout:
      reader: yolo
      parts:
        - ann: "labels_flat"
          images: "images_flat"
      names: [diver]
    # images_flat names are "<session-dir>_<frame>.jpg" (see
    # scripts/02_flatten_vddc_images.py), e.g. "barbados_scuba_011_A_2550.jpg".
    # Capture everything before the trailing frame number, i.e. the session
    # id -- NOT "^([a-zA-Z]+\d*)_", which stops at the first underscore and
    # collapses all 22 barbados dives (plus all 12 pool dives) into one group
    # each. With only 3 group keys left (barbados/pool/wayzata) the 80/10/10
    # split can't approximate its ratios -- each site lands wholesale in one
    # split, so val/test can end up with zero images from most sites.
    group: {mode: regex, pattern: "^(.+)_\\d+$"}
    stride: 10
    cap: 2500
    dedupe_phash: 6

  # ----------------------------------------------------------------- surface --
  seaships:
    enabled: true
    domain: surface
    title: "SeaShips (7000)"
    licence: "Registration required; check terms before redistribution"
    sources:
      - method: http
        url: "http://www.lmars.whu.edu.cn/prof_web/shaozhenfeng/datasets/SeaShips(7000).zip"
        expect: "seaships.zip"
      - method: gdown
        id: "1iwC_ITv2_x1vZFQ7Z8ZnL_kSXMB3DrOa"
        expect: "seaships.zip"
      - method: manual
        expect: "seaships.zip"
        note: |
          Direct: http://www.lmars.whu.edu.cn/prof_web/shaozhenfeng/datasets/SeaShips(7000).zip
          Google Drive: https://drive.google.com/file/d/1iwC_ITv2_x1vZFQ7Z8ZnL_kSXMB3DrOa/view
          HuggingFace: https://huggingface.co/datasets/datnguyentien204/Seaship7000
          Save as data/raw/_archives/seaships.zip
    layout:
      reader: voc
      parts:
        - ann: "**/annotations"
          images: "**/images"
    group: {mode: none}
    stride: 1
    cap: 5000

  smd:
    enabled: true
    domain: surface
    title: "Singapore Maritime Dataset"
    licence: "Research use"
    sources:
      - method: manual
        expect: "smd.zip"
        note: |
          https://sites.google.com/site/dilipprasad/home/singapore-maritime-dataset
          Unzip so data/raw/smd/ contains VIS_Onshore/, VIS_Onboard/ (each with
          Videos/ and ObjectGT/). Then: python scripts/02_extract_smd_frames.py
          -- decodes videos + converts the .mat ground truth to YOLO .txt.
          Left disabled until that's been run (see README "2. Prepare" -> SMD).
    layout:
      reader: yolo
      parts:
        - ann: "smd/labels"
          images: "smd/images"
      names: [Ferry, Buoy, "Vessel/ship", "Speed boat", Boat, Kayak, "Sail boat", "Swimming person", "Flying bird/plane", Other]
    group: {mode: regex, pattern: "^(MVI_\\d+)"}
    stride: 15
    cap: 3000

  mods:
    enabled: true
    domain: surface
    title: "MODS / MODD2 (USV obstacle benchmark)"
    cite: "ViCoS Lab"
    licence: "Research use"
    sources:
      - method: kaggle
        slug: "k0vidsharma/water-land-edge-segmentation-mods"
      - method: manual
        expect: "mods.zip"
        note: |
          https://www.kaggle.com/datasets/k0vidsharma/water-land-edge-segmentation-mods
          Fallback: https://vision.fe.uni-lj.si/public/mods/  (and github.com/bborja/modd)
          Save as data/raw/_archives/mods.zip
    layout:
      reader: yolo
      parts:
        - ann: "all_labels"
          images: "Segmentation/images"
      names: [ship, boat, person, buoy]
    group: {mode: regex, pattern: "^(seq\\d+)"}
    stride: 5
    cap: 3000

  # --------------------------------------------------------------- negatives --
  mastr_neg:
    enabled: true
    domain: surface
    title: "MaSTr1325 (negative mining only)"
    cite: "Bovcon et al., IROS 2019"
    licence: "Research use"
    sources:
      - method: manual
        expect: "MaSTr1325_images_512x384.zip"
        note: |
          https://www.vicos.si/resources/mastr1325/
          (also referenced at https://github.com/bborja/modd)
          Download these 2 files:
            1. MaSTr1325 Images [512x384]
            2. MaSTr1325 Ground Truth Annotations [512x384]
          Save both in data/raw/_archives/
          NOT used for boxes -- its "environment" class is one blob covering
          shoreline, boats and buoys alike, which makes useless labels. Used
          only to mine guaranteed object-free water/sky frames, which the
          unknown-bucket design needs so the detector learns not to fire.
      - method: manual
        expect: "MaSTr1325_masks_512x384.zip"
        note: |
          See above -- download Ground Truth Annotations [512x384] from the same page.
    layout:
      reader: mask_negative
      parts:
        - ann: "."
          images: "."
      obstacle_values: [0]      # 0=obstacle/environment, 1=water, 2=sky, 4=ignore
      max_obstacle_frac: 0.01
    group: {mode: none}
    stride: 1
    cap: 1200

# Fraction of the final training set that should be object-free negatives.
# Mined from mastr_neg plus any annotation-free frames in the other sources.
# Without these the unknown bucket fills with confident nonsense, because a
# closed-set detector assigns SOME class to everything it fires on.
negative_fraction: 0.12
